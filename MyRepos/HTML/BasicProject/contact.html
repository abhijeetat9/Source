<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Abhijit Tawde">
    <meta name="description" content="Contact Information for The Little Taco Shop">
    <title>Contact Us - LTS</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>Contact Us</h1>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/#about">About <abbr title="Little Taco Shop">LTS</abbr></a></li>
            <li><a href="/#menu">Our Menu</a></li>
            <li><a href="hours.html">Store Hours</a></li>
        </ul>
    </nav>
     <figure>
    <img src="img/tacos_close_up_400x260.png" alt="Little Taco Shop Tacos" title="Tacos ready to eat!" width="400" height="260">
        <figcaption>Little Taco Shop Tacos</figcaption>
    </figure>
</header>
<hr>
<main>
    <article id="contact">
        <form action="https://httpbin.org/get" method="get">
            <h2 id="contact">Contact Us</h2>
            <fieldset>
                <legend>Send us a message</legend>
                <p>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="your name">
                </p>
                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="your email">
                </p>
                <p>
                    <label for="message">Your Message:</label>
                    <br>
                    <textarea id="message" name="message" rows="10" cols="30" placeholder="enter your message here"></textarea>
                </p>
            </fieldset>
            <p>
                <button type="submit">Send</button>
                <button type="reset">Reset</button>
            </p>
        </form>
    </article>
    <article id="location">
        <h2>Our Location</h2>
        <address>
            555 Taco Tempatation Lane, Suite T<br>
            Kansas City, MO 55555-5555<br>
            <br>
            Phone: <a href="tel:+1234567890">+1 (234) 567-890</a><br>
        </address>
    </article>
    <p><a href="#">Back to Top</a></p>
</main>
<hr>
<footer>
    <p>Copyright &copy; The Little Taco Shop</p>
</body>
</html>
