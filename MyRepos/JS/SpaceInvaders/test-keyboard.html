<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animation Test</title>

    <style>
        body {
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: monospace;
            color: white;

        }
        canvas {
            border: 2px solid white;
        }
        #info{
            margin-top: 20px;
            color: #0f0;
            font-size: 14px;
        }
    </style>
</head>
<body>
<canvas id="myCanvas" width="600" height="400"></canvas>
<div id="info">Use Arrow keys</div>
<script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");
    const id = canvas.id;
    
    const keys = {};

    // ═══════════════════════════════════════
    // KEYBOARD INPUT
    // ═══════════════════════════════════════
    document.addEventListener('keydown', function(e) {
        keys[e.code] = true;  // Mark key as pressed

        // Prevent arrow keys from scrolling the page
        if (e.code.startsWith('Arrow')) {
            e.preventDefault();
        }
    });

    document.addEventListener('keyup', function(e) {
        keys[e.code] = false;  // Mark key as released
    });
    let boxSpeed = 3;
    let box1X = 100, box1Y = 180; 
    let box1color = '#0f0';
    let box1ColorTimer = 0;
    let box2X = 400, box2Y = 180;
    let box2color = '#00f';
    let box2ColorTimer = 0;
    
    let collisionCount =0;

    function checkCollision(box1X,box1Y,box2X,box2Y) {
        return box1X < box2X + 40 &&
            box1X + 40 > box2X &&
            box1Y < box2Y + 40 &&
            box1Y + 40 > box2Y;
    }
    function update() {
        if (keys['KeyA']) box1X -= boxSpeed;
        if (keys['KeyD']) box1X += boxSpeed;
        if (keys['KeyW']) box1Y -= boxSpeed;
        if (keys['KeyS']) box1Y += boxSpeed;
        // ... etc

        // Player 2 movement (Arrows)
        if (keys['ArrowLeft']) box2X -= boxSpeed;
        if (keys['ArrowRight']) box2X += boxSpeed;
        if (keys['ArrowUp']) box2Y -= boxSpeed;
        if (keys['ArrowDown']) box2Y += boxSpeed;

        const isColliding = checkCollision(box1X, box1Y, box2X, box2Y);

        if (isColliding && !wasColliding) {
            // NEW collision (only count once per collision)
            collisionCount++;
            console.log('Collision #' + collisionCount);

            // Turn both boxes red
            box1color = '#f00';
            box2color = '#f00';
            box1ColorTimer = 120;  // 2 seconds at 60 FPS
            box2ColorTimer = 120;
        }

        wasColliding = isColliding;  // Remember for next frame

        // ═══════════════════════════════════════
        // COLOR TIMER COUNTDOWN
        // ═══════════════════════════════════════
        if (box1ColorTimer > 0) {
            box1ColorTimer--;
            if (box1ColorTimer === 0) {
                box1color = '#0f0';  // Reset to green
            }
        }

        if (box2ColorTimer > 0) {
            box2ColorTimer--;
            if (box2ColorTimer === 0) {
                box2color = '#00f';  // Reset to blue
            }
        }
    }
    
    
    function draw() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = box1color;
        ctx.fillRect(box1X, box1Y, 40, 40);
        ctx.fillStyle = box2color;
        ctx.fillRect(box2X, box2Y, 40, 40);
        ctx.fillStyle = '#fff';
        ctx.font = '20px monospace';
        ctx.fillText('Collisions: ' + collisionCount, 10, 30);
    }

    function gameLoop(){
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
