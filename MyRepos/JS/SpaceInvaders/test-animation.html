<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animation Test</title>

<style>
    body {
        background: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: monospace;
        color: white;

    }
    canvas {
        border: 2px solid white;
    }
</style>
</head>
<body>
<canvas id="myCanvas" width="600" height="400"></canvas>
<script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");
    
    let boxX = 280;
    let boxY = 180;
    let boxSpeedX = 3;
    let boxSpeedY = 3;
    let color = "#0f0";

    function update() {
        boxX += boxSpeedX;
        boxY += boxSpeedY;

        // Check right wall
        if (boxX > canvas.width - 40) {
            boxSpeedX = -boxSpeedX;  // Reverse X direction
            color = '#0f0'    // Change color
        }
        if (boxX < 0) {
            boxSpeedX = -boxSpeedX;
            color = '#00f';
        }
        if(boxY > canvas.height - 40) {
            boxSpeedY = -boxSpeedY;
            color = '#f00';
        }
        if(boxY < 0) {
            boxSpeedY = -boxSpeedY;
            color = '#070';
        }
    }
    function draw() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = color;
        ctx.fillRect(boxX, boxY, 40, 40);
    }
    
    function gameLoop(){
        update();
        draw();
        
        requestAnimationFrame(gameLoop);
    }
    
    gameLoop();
</script>
</body>
</html>
