<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Collision Math</title>
    <style>
        body{
            background: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: monospace;
            color: white;
        }
        canvas{
            border: 2px solid white;
            margin-bottom: 20px;
        }
        #debug{
            background: #111;
            padding: 20px;
            border: 1px solid #444;
            font-size: 14px;
            line-height: 1.8;
            max-width: 600px;
        }
        .true {color: #0f0; }
        .false {color: #f00; }
        .colliding {color: #ff0; font-weight: bold; }
    </style>
</head>
<body>
<canvas id="myCanvas" width="600" height="400"></canvas>
<div id="debug">
    <div> Move Box A with WASD, Move box B with Arrow Keys </div>
    <hr style="border-color: #444; margin: 10px 0;">
    <div id="debugText"></div>
</div>
<script>
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');
    const debugDiv = document.getElementById('debugText');
    
    
    let boxA = {x:50, y:50,w:30,h:30,color: '#0f0' };
    let boxB = {x:50, y:81,w:30,h:30,color: '#00f' };
    
    const speed = 3;
    const keys = {};
    
    document.addEventListener('keydown', function(e) {
        keys[e.code] = true;
        if (e.code.startsWith('Arrow')) e.preventDefault();
    });
    
    document.addEventListener('keyup', function(e) {
        keys[e.code] = false;
    });
    
    
    function checkCollision(a,b) {
        const aLeft = a.x;
        const aRight = a.x + a.w;
        const aTop = a.y;
        const aBottom = a.y + a.h;

        const bLeft = b.x;
        const bRight = b.x + b.w;
        const bTop = b.y;
        const bBottom = b.y + b.h;

        const xOverlap = aRight > bLeft && aLeft < bRight;
        const yOverlap = aBottom > bTop && aTop < bBottom;

        const colliding = xOverlap && yOverlap;

        return {
            colliding,
            aLeft, aRight, aTop, aBottom,
            bLeft, bRight, bBottom, bTop,
            xOverlap,
            yOverlap,

            condition1: aRight > bLeft,
            condition2: aLeft < bRight,
            condition3: aBottom > bTop,
            condition4: aTop < bBottom,
        };
    }
    
    function Update() {
        if (keys['KeyA']) boxA.x -= speed;
        if (keys['KeyD']) boxA.x += speed;
        if (keys['KeyW']) boxA.y -= speed;
        if (keys['KeyS']) boxA.y += speed;

        if (keys['ArrowLeft']) boxB.x -= speed;
        if (keys['ArrowRight']) boxB.x += speed;
        if (keys['ArrowUp']) boxB.y -= speed;
        if (keys['ArrowDown']) boxB.y += speed;


        boxA.x = Math.max(0, Math.min(boxA.x, canvas.width - boxA.w));
        boxA.y = Math.max(0, Math.min(boxA.y, canvas.height - boxA.h));
        boxB.x = Math.max(0, Math.min(boxB.x, canvas.width - boxB.w));
        boxB.y = Math.max(0, Math.min(boxB.y, canvas.height - boxB.h));
    }

    function Draw(){
        const collision = checkCollision(boxA,boxB);
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle = collision.colliding ? '#f00' : boxA.color;
        ctx.fillRect(boxA.x, boxA.y, boxA.w, boxA.h);

        ctx.fillStyle = collision.colliding ? '#f00' : boxB.color;
        ctx.fillRect(boxB.x, boxB.y, boxB.w, boxB.h);

        ctx.strokeStyle = '#444';
        ctx.lineWidth = 1;

        ctx.strokeStyle = '#0f04';
        ctx.strokeRect(boxA.x, boxA.y, boxA.w, boxA.h);

        ctx.strokeStyle = '#00f4';
        ctx.strokeRect(boxB.x, boxB.y, boxB.w, boxB.h);

        updateDebug(collision);

    }
    
    function updateDebug(c) {
        const tf = (bool) => bool ? 'TRUE' : 'FALSE';
        const cls = (bool) => bool ? 'true' : 'false';

        debugDiv.innerHTML = `
      <strong>Box A (Green):</strong><br>
      &nbsp;&nbsp;Position: (${boxA.x.toFixed(0)}, ${boxA.y.toFixed(0)})<br>
      &nbsp;&nbsp;Left: ${c.aLeft.toFixed(0)} | Right: ${c.aRight.toFixed(0)}<br>
      &nbsp;&nbsp;Top: ${c.aTop.toFixed(0)} | Bottom: ${c.aBottom.toFixed(0)}<br>
      <br>
      <strong>Box B (Blue):</strong><br>
      &nbsp;&nbsp;Position: (${boxB.x.toFixed(0)}, ${boxB.y.toFixed(0)})<br>
      &nbsp;&nbsp;Left: ${c.bLeft.toFixed(0)} | Right: ${c.bRight.toFixed(0)}<br>
      &nbsp;&nbsp;Top: ${c.bTop.toFixed(0)} | Bottom: ${c.bBottom.toFixed(0)}<br>
      <br>
      <strong>Collision Checks:</strong><br>
      &nbsp;&nbsp;① A.right (${c.aRight.toFixed(0)}) > B.left (${c.bLeft.toFixed(0)})? 
      <span class="${cls(c.condition1)}">${tf(c.condition1)}</span><br>
      
      &nbsp;&nbsp;② A.left (${c.aLeft.toFixed(0)}) < B.right (${c.bRight.toFixed(0)})? 
      <span class="${cls(c.condition2)}">${tf(c.condition2)}</span><br>
      
      &nbsp;&nbsp;③ A.bottom (${c.aBottom.toFixed(0)}) > B.top (${c.bTop.toFixed(0)})? 
      <span class="${cls(c.condition3)}">${tf(c.condition3)}</span><br>
      
      &nbsp;&nbsp;④ A.top (${c.aTop.toFixed(0)}) < B.bottom (${c.bBottom.toFixed(0)})? 
      <span class="${cls(c.condition4)}">${tf(c.condition4)}</span><br>
      <br>
      &nbsp;&nbsp;<strong>X-Axis Overlap:</strong> 
      <span class="${cls(c.xOverlap)}">${tf(c.xOverlap)}</span><br>
      
      &nbsp;&nbsp;<strong>Y-Axis Overlap:</strong> 
      <span class="${cls(c.yOverlap)}">${tf(c.yOverlap)}</span><br>
      <br>
      &nbsp;&nbsp;<span class="colliding">COLLISION: ${tf(c.colliding)}</span>
    `;
    }
    
    function isPointInsideBox(pointX, pointY,box) {
        return pointX >box.x &&
            pointX < box.x + box.w &&
            pointY > box.y &&
            pointY < box.y + box.h;
    }

    function gameLoop() {
        Update();
        Draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script> 

</body>
</html>
